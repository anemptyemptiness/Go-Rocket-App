grpc:
  host: "0.0.0.0"
  port: "50053"

postgres:
  host: "localhost"
  port: "5434"
  database: "iam-service"
  user: "iam-service-user"
  password: "iam-service-password"
  sslmode: "disable"

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0
  connection_timeout: 5s
  max_idle: 10
  idle_timeout: 10s

session:
  ttl: 24h

logger:
  level: "debug"

encryption:
  cost: 10

otel:
  enable_otlp: true
  endpoint: "localhost:4317"
  service_name: "iam"
  environment: "dev"
  service_version: "v1.0.0"
  sampling_ratio: 0.5