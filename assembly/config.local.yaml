assembler:
  limit: 15

kafka:
  brokers:
    - "localhost:9092"

logger:
  level: "debug"

order_paid_consumer:
  topic: "order.paid"
  group_id: "1"

ship_assembled_producer:
  topic: "assembly.ship-assembled"

otel:
  enable_otlp: true
  endpoint: "localhost:4317"
  service_name: "assembly"
  environment: "dev"
  service_version: "v1.0.0"
  sampling_ratio: 0.5
