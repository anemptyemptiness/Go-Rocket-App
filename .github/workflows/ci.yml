name: "CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: "Build"
    uses: ./.github/workflows/build.yml

  lint:
    name: "Lint"
    needs: build
    uses: ./.github/workflows/lint.yml

  test-api:
    name: "Test API"
    needs: build
    uses: ./.github/workflows/test-api.yml

  test-unit:
    name: "Test Unit"
    needs: build
    uses: ./.github/workflows/test-unit.yml

  test-e2e:
    name: "Test E2E"
    needs: build
    uses: ./.github/workflows/test-e2e.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: task test

      - name: Run integration tests
        run: task test:api

      - name: Run coverage
        run: task test:coverage

      - name: Update coverage gist
        if: github.ref == 'refs/heads/main' && success()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | tail -n1 | awk '{print $NF}')

          cat > coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "$COVERAGE",
            "color": "green"
          }
          EOF

          curl -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/$GIST_ID \
            -d "$(jq -n --arg content "$(cat coverage.json)" '{
              files: {
                "coverage.json": {
                  content: $content
                }
              }
            }')"